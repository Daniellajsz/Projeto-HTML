<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro & Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #5c5656;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;

            /* Fundo */
            background:
                linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)),
                url("FUNDOLOGIN.jpg");
            background-size: cover;
            background-position: center;
        }

        #voltar {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            color: #fff;
            background: #313131cc;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
            backdrop-filter: blur(2px);
        }

        #voltar:hover {
            background: #ffffffcc;
            color: #000;
        }

        /* CONTÊINER PRINCIPAL COM AS DUAS DIVS LADO A LADO */
        .flex-container {
            display: flex;
            gap: 40px;
            background: none;
        }

        .box {
            background: #c4bdbd;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .box2 {
            background: #c4bdbd;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            height: 300px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);

        }


        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            margin-top: 10px;
            display: block;
            color: #444;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #6b3c3c;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #475779;
        }

        #mensagem {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }
    </style>

</head>

<body>

    <a href="index.html" id="voltar">Voltar</a>

    <div class="flex-container">

        <!--CAIXA DE CADASTRO -->
        <div class="box">
            <h2>Cadastro</h2>

            <form id="formCadastro" method="POST" action="cadastrar.php">

                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>

                <button type="submit">Cadastrar</button>
            </form>

            <div id="mensagem"></div>
        </div>

        <!-- CAIXA DE LOGIN -->
        <div class="box2">
            <h2>Login</h2>

            <form id="formLogin" action="login.php" method="POST">

                <label for="loginEmail">E-mail:</label>
                <input type="email" id="loginEmail" name="email" required>

                <label for="loginSenha">Senha:</label>
                <input type="password" id="loginSenha" name="senha" required>

                <button type="submit">Entrar</button>
            </form>

            <div id="msgLogin"></div>
            
        </div>

    </div>

    <script>

        // CADASTRO 

        const urlParams = new URLSearchParams(window.location.search);

        if (urlParams.has("sucesso")) {
            const mensagem = document.getElementById("mensagem");
            if (mensagem) {
                mensagem.style.color = "green";
                mensagem.textContent = "Cadastro realizado com sucesso!";

                setTimeout(() => {
                    mensagem.textContent = "";
                }, 3000);
            }
        }

        if (urlParams.has("erro")) {
            const mensagem = document.getElementById("mensagem");
            if (mensagem) {
                mensagem.style.color = "red";
                mensagem.textContent = "Erro ao cadastrar o usuário.";
            }
        }

        // LOGIN 
        document.getElementById("formLogin").addEventListener("submit", function (e) {
            const email = document.getElementById("loginEmail").value.trim();
            const senha = document.getElementById("loginSenha").value.trim();
            const msgLogin = document.getElementById("msgLogin");

            if (!email || !senha) {
                e.preventDefault();
                msgLogin.style.color = "red";
                msgLogin.textContent = "Preencha todos os campos!";
                return;
            }

            msgLogin.style.color = "green";
            msgLogin.textContent = "Validando...";
        });

    </script>


</body>

</html>
